[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Only the Netlify subdomain matches this host, so jacobjonsonlabs.com cannot loop.
# Do not add a /* -> /index.html 200 rewrite here. Unknown URLs must fall through
# to 404.html. Route aliases and the English 404 live in public/_redirects, which
# Netlify reads before this file.
[[redirects]]
  from = "https://jacobjonsonlabs.netlify.app/*"
  to = "https://jacobjonsonlabs.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
