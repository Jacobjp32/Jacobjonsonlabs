[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Security headers aplicados em todas as rotas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # TODO: Implementar Content-Security-Policy em etapa posterior.
    # Requer mapeamento completo de origens: Google Fonts, YouTube embeds,
    # Formspree, partículas canvas, etc. Implementar sem pressa para não
    # quebrar funcionalidades existentes.

# Cache longo para assets com hash de build (JS/CSS/imagens em /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML nunca cacheado — garante que nova versão seja sempre buscada
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Assets estáticos da pasta public (imagens, vídeos, fontes) — cache moderado
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
