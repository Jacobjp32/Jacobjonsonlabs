    <script>
      (function () {
        try {
          var path = window.location.pathname.replace(/\/+$/, "") || "/";
          var pathLang = path === "/en" || path.indexOf("/en/") === 0 ? "en" : "pt";
          var savedLang = localStorage.getItem("lang");
          var browserLocales =
            (navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language]) || [];

          var lang =
            path === "/" && (savedLang === "pt" || savedLang === "en")
              ? savedLang
              : path === "/"
                ? browserLocales.some(function (locale) {
                    return String(locale).toLowerCase().indexOf("pt") === 0;
                  })
                  ? "pt"
                  : "en"
                : pathLang;

          window.__INITIAL_LANG__ = lang;

          if (path === "/" && lang === "en") {
            window.location.replace("/en");
            return;
          }

          if (savedLang !== lang) {
            localStorage.setItem("lang", lang);
          }

          var isHomeRoute = path === "/" || path === "/en";
          var currentUrl =
            lang === "en"
              ? "https://jacobjonsonfilmmaker.netlify.app/en"
              : "https://jacobjonsonfilmmaker.netlify.app/";

          document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";

          if (isHomeRoute) {
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) {
              canonical.setAttribute("href", currentUrl);
            }

            var ptAlt = document.querySelector('link[rel="alternate"][hreflang="pt-BR"]');
            if (ptAlt) {
              ptAlt.setAttribute("href", "https://jacobjonsonfilmmaker.netlify.app/");
            }

            var enAlt = document.querySelector('link[rel="alternate"][hreflang="en"]');
            if (enAlt) {
              enAlt.setAttribute("href", "https://jacobjonsonfilmmaker.netlify.app/en");
            }
          }

          var languageMeta = document.querySelector('meta[name="language"]');
          if (languageMeta) {
            languageMeta.setAttribute("content", lang === "pt" ? "pt-BR" : "en");
          }

          var ogLocale = document.querySelector('meta[property="og:locale"]');
          if (ogLocale) {
            ogLocale.setAttribute("content", lang === "pt" ? "pt_BR" : "en_US");
          }

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) {
            ogUrl.setAttribute("content", currentUrl);
          }
        } catch (error) {
          console.error("Language bootstrap failed", error);
        }
      })();
    </script>
